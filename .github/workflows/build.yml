name: Build NNAP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Platform Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses \vert{}\vert{} true$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Generate Lightweight Android App Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/nnap/app
          mkdir -p app/src/main/res/mipmap-hdpi

          # 1. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NNAP Studio"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          EOF

          # 3. App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nnap.app'
              compileSdk 33

              defaultConfig {
                  applicationId "com.nnap.app"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="NNAP Studio"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/nnap/app/MainActivity.java
          package com.nnap.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          # 6. Web Application UI (index.html)
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NNAP Studio</title>
            <style>
              body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
              .container { max-width: 500px; margin: 0 auto; }
              h1 { text-align: center; color: #38bdf8; }
              .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
              label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
              input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
              button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
              .status-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>NNAP Studio</h1>
              
              <div class="card">
                <h3>1. Configuration des Clés API</h3>
                <label>Clé API Google Gemini (IA) :</label>
                <input type="password" id="gemini-key" placeholder="AIzaSy...">
                <label>TikTok Developer Client ID :</label>
                <input type="text" id="tiktok-client-id" placeholder="aw...">
                <button onclick="saveKeys()">Enregistrer les Clés</button>
              </div>

              <div class="card">
                <h3>2. Agent IA - Générateur de Script</h3>
                <label>Thématique de la vidéo :</label>
                <input type="text" id="topic" placeholder="Ex: Astuces IA TikTok">
                <button onclick="generateScript()">Générer Script IA</button>
                <div id="ai-output" class="status-box">Les résultats s'afficheront ici...</div>
              </div>
            </div>

            <script>
              window.onload = function() {
                if(localStorage.getItem('gemini_key')) document.getElementById('gemini-key').value = localStorage.getItem('gemini_key');
                if(localStorage.getItem('tiktok_client_id')) document.getElementById('tiktok-client-id').value = localStorage.getItem('tiktok_client_id');
              };

              function saveKeys() {
                localStorage.setItem('gemini_key', document.getElementById('gemini-key').value);
                localStorage.setItem('tiktok_client_id', document.getElementById('tiktok-client-id').value);
                alert("Clés enregistrées avec succès !");
              }

              async function generateScript() {
                const key = localStorage.getItem('gemini_key');
                const topic = document.getElementById('topic').value;
                const out = document.getElementById('ai-output');
                if(!key) { out.innerText = "Veuillez configurer votre clé Gemini API."; return; }
                out.innerText = "Génération par l'IA en cours...";
                try {
                  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Génère un script viral TikTok sur : " + topic }] }] })
                  });
                  const data = await res.json();
                  out.innerText = data.candidates[0].content.parts[0].text;
                } catch(e) {
                  out.innerText = "Erreur : " + e.message;
                }
              }
            </script>
          </body>
          </html>
          EOF

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Export APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NNAP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
