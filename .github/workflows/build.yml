name: Build NNAP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract NNAP project
        run: |
          mkdir source
          unzip -q NNAP_ANDROID_READY.zip -d source

      - name: Fix Android entry point
        working-directory: source
        run: |
          rm -f app/src/main/java/com/nnap/app/MainActivity.kt
          cat > app/src/main/java/com/nnap/app/MainActivity.java <<'EOF'
package com.nnap.app;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        WebView webView = new WebView(this);
        webView.setWebViewClient(new WebViewClient());

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);

        webView.loadUrl("file:///android_asset/index.html");

        setContentView(webView);
    }
}
EOF

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NNAP-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
