<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Neon Blue Gradient for Elements -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)" />

  <!-- Outer Glowing Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonBlue)" stroke-width="8" stroke-dasharray="12 12" opacity="0.6" />

  <!-- AI Neural Network Nodes & Connections -->
  <g stroke="url(#neonBlue)" stroke-width="4" opacity="0.4">
    <line x1="256" y1="110" x2="160" y2="180" />
    <line x1="256" y1="110" x2="352" y2="180" />
    <line x1="160" y1="180" x2="180" y2="320" />
    <line x1="352" y1="180" x2="332" y2="320" />
    <line x1="180" y1="320" x2="256" y2="390" />
    <line x1="332" y1="320" x2="256" y2="390" />
  </g>

  <!-- Central Play Symbol (Studio / TikTok / YouTube) -->
  <path d="M220 180 L330 256 L220 332 Z" fill="url(#neonBlue)" filter="url(#glow)" />

  <!-- Neural Nodes -->
  <circle cx="256" cy="110" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="160" cy="180" r="8" fill="#38bdf8" />
  <circle cx="352" cy="180" r="8" fill="#38bdf8" />
  <circle cx="180" cy="320" r="8" fill="#38bdf8" />
  <circle cx="332" cy="320" r="8" fill="#38bdf8" />
  <circle cx="256" cy="390" r="10" fill="#38bdf8" filter="url(#glow)" />

  <!-- NNAP Text Logo -->
  <text x="256" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">NNAP</text>
</svg>
